services:
  mysql:
    image: mysql:5.7
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-miyaui_root_local}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-www_miyaui_com_dev}
      MYSQL_USER: ${WORDPRESS_DB_USER:-www_miyaui_com_dev}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-miyaui_local_wp}
    ports:
      - "${MYSQL_PORT:-4306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p${WORDPRESS_DB_ROOT_PASSWORD:-miyaui_root_local} --silent
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    ports:
      - "${REDIS_PORT:-63790}:6379"

  wordpress:
    build:
      context: ./docker/local/wordpress
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      WP_DB_HOST: mysql:3306
      WP_DB_NAME: ${WORDPRESS_DB_NAME:-www_miyaui_com_dev}
      WP_DB_USER: ${WORDPRESS_DB_USER:-www_miyaui_com_dev}
      WP_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-miyaui_local_wp}
      WP_HOME: ${WORDPRESS_HOME:-http://localhost:8082}
      WP_SITEURL: ${WORDPRESS_SITEURL:-http://localhost:8082}
      WP_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WP_REDIS_HOST: redis
      WP_REDIS_PORT: 6379
      WP_REDIS_DATABASE: ${WORDPRESS_REDIS_DATABASE:-1}
      WP_LOCAL_DEBUG: ${WORDPRESS_DEBUG:-false}
    ports:
      - "${WORDPRESS_PORT:-8082}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/local/wordpress/wordpress.htaccess:/var/www/html/.htaccess:ro
      - ./docker/local/wordpress/wp-config.local.php:/var/www/html/wp-config.php:ro
      - ./docker/local/wordpress/php.ini:/usr/local/etc/php/conf.d/zz-miyaui.ini:ro
      - ./wp-content/themes/b2Jitheme/Center/sgcj/linux-x86_64/ixed.8.0.lin:/opt/miyaui/ixed.8.0.lin:ro

  postgres:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  fastapi:
    volumes:
      - ./apps/api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://miyaui:${POSTGRES_PASSWORD:-miyaui_local_pg}@postgres:5432/miyaui
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${FASTAPI_PORT:-8001}:8000"

  nuxt:
    volumes:
      - ./apps/web:/app
      - nuxt_node_modules:/app/node_modules
    environment:
      FASTAPI_URL: http://fastapi:8000
      WORDPRESS_URL: http://wordpress
    ports:
      - "${NUXT_PORT:-3001}:3000"

  celery-worker:
    volumes:
      - ./apps/api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://miyaui:${POSTGRES_PASSWORD:-miyaui_local_pg}@postgres:5432/miyaui
      REDIS_URL: redis://redis:6379/0

  celery-beat:
    volumes:
      - ./apps/api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://miyaui:${POSTGRES_PASSWORD:-miyaui_local_pg}@postgres:5432/miyaui
      REDIS_URL: redis://redis:6379/0

volumes:
  mysql_data:
  nuxt_node_modules:
