<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演示页面 - 晨风自定义</title>
    <link rel="stylesheet" href="./dist/bootstrap-5.3.2-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./dist/fontawesome-6.5.1/css/fontawesome.min.css">
    <link rel="stylesheet" href="./dist/fontawesome-6.5.1/css/solid.min.css">
    <link rel="stylesheet" href="./css/demo.css">
    <script src="./js/demo.js"></script>
</head>

<body>
    <header class="d-flex justify-content-around">
        <div class="d-flex justify-content-start align-items-center environment">
            <div class="datetime" title="模拟的时间">
                <div class="time">20:20:00</div>
                <div class="solar">2024/1/17</div>
            </div>
            <div class="">
                <button type="button" class="btn btn-light" title="编辑模拟时间"><i
                        class="fa-solid fa-pen-to-square"></i></button>
                <button type="button" class="btn btn-light" title="设置参数"><i class="fa-solid fa-gear"></i></button>
            </div>
        </div>
        <div class="btn-group preview-devices" role="group" aria-label="">
            <button type="button" class="btn btn-light" title="PC端"><i class="fa-solid fa-desktop"></i></button>
            <button type="button" class="btn btn-light" title="平板端"><i class="fa-solid fa-tablet"></i></button>
            <button type="button" class="btn btn-light" title="手机端"><i class="fa-solid fa-mobile"></i></button>
        </div>
        <div>
            <button type="button" class="btn btn-primary" title="">下载文件</button>
        </div>
    </header>
    <div class="preview">

    </div>
    <script src="./dist/bootstrap-5.3.2-dist/js/bootstrap.min.js"></script>
</body>

</html>
